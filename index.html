<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoX TACTICAL OS v10.5</title>
    <style>
        @import url('https://googleapis.com');
        :root { --cyan: #00f0ff; --green: #00ff66; --red: #ff3333; --bg: #010409; --panel: rgba(6,16,30,0.85); }
        * { box-sizing: border-box; font-family: 'Share Tech Mono', monospace; }
        
        /* Ajuste de pantalla completa responsiva para móviles */
        body { background-color: var(--bg); color: var(--cyan); margin: 0; display: flex; height: 100vh; height: 100dvh; overflow: hidden; background-image: radial-gradient(rgba(0,240,255,0.06) 1.5px, transparent 0); background-size: 30px 30px; }
        #hud-layout { display: flex; width: 100%; height: 100%; padding: 10px; gap: 10px; }
        
        /* Paneles tácticos ciberpunk */
        .cyber-panel { background: var(--panel); border: 1px solid var(--cyan); box-shadow: 0 0 20px rgba(0,240,255,0.1); clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px)); display: flex; flex-direction: column; padding: 15px; position: relative; }
        #left-monitor { width: 300px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
        
        /* Menú de navegación interactivo */
        .nav-tabs { display: flex; gap: 5px; margin-bottom: 5px; }
        .tab-btn { flex: 1; background: rgba(0,240,255,0.05); border: 1px solid var(--cyan); color: var(--cyan); padding: 8px; cursor: pointer; font-size: 0.8em; font-weight: bold; clip-path: polygon(0 0, 85% 0, 100% 8px, 100% 100%, 0 100%); }
        .tab-btn.active { background: var(--cyan); color: var(--bg); box-shadow: 0 0 10px var(--cyan); }
        .tab-content { flex: 1; display: none; flex-direction: column; height: calc(100% - 45px); }
        .tab-content.active { display: flex; }
        
        /* Indicadores HUD */
        .panel-title { color: var(--green); font-size: 0.9em; letter-spacing: 2px; border-bottom: 1px dashed var(--green); padding-bottom: 5px; margin-bottom: 10px; display: flex; justify-content: space-between; }
        canvas { width: 100%; height: 100%; display: block; background: rgba(0,0,0,0.5); }
        .icon-grid { display: flex; justify-content: space-around; align-items: center; margin: 10px 0; background: rgba(0,0,0,0.3); padding: 10px; border: 1px solid rgba(0,240,255,0.1); }
        .radar-box { width: 75px; height: 75px; border: 1px solid rgba(0,240,255,0.3); border-radius: 50%; position: relative; overflow: hidden; }
        .radar-box::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(45deg, rgba(0,240,255,0.4) 0%, transparent 50%); transform-origin: center; animation: rotHUD 2.5s linear infinite; }
        .ring-box { width: 75px; height: 75px; border: 3px dotted var(--green); border-radius: 50%; animation: rotHUDBack 6s linear infinite; display: flex; align-items: center; justify-content: center; font-size: 0.8em; color: var(--green); font-weight: bold; }
        #brain-activity { height: 110px; display: flex; align-items: flex-end; justify-content: space-between; padding: 10px; background: rgba(0,0,0,0.4); border: 1px solid rgba(0,240,255,0.2); }
        .bar { width: 6px; background-color: var(--cyan); animation: pulseBar 0.8s infinite ease-in-out; transform-origin: bottom; box-shadow: 0 0 8px var(--cyan); }
        
        /* Chasis flexible para forzar la barra a quedarse fija abajo */
        #chat-center { flex: 1; display: flex; flex-direction: column; height: 100%; min-width: 0; }
        #chat-box { flex: 1; height: calc(100% - 130px); overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 8px; margin-bottom: 5px; border-bottom: 1px solid rgba(0,240,255,0.2); }
        .msg { padding: 10px 14px; max-width: 90%; font-size: 0.9em; letter-spacing: 0.5px; line-height: 1.3; margin-bottom: 2px; }
        
        .user { border: 1px solid var(--green); align-self: flex-end; clip-path: polygon(0 0, 96% 0, 100% 12px, 100% 100%, 4% 100%, 0 calc(100% - 12px)); background: rgba(0,255,102,0.04); }
        .neox { border: 1px solid var(--cyan); align-self: flex-start; clip-path: polygon(4% 0, 100% 0, 100% calc(100% - 12px), 96% 100%, 0 100%, 0 12px); background: rgba(0,240,255,0.04); }
        .prefix { font-weight: bold; display: block; margin-bottom: 3px; font-size: 0.8em; letter-spacing: 1px; }
        .user .prefix { color: var(--green); } .neox .prefix { color: var(--cyan); }
        #thinking-indicator { display: none; color: var(--cyan); font-size: 0.85em; padding: 5px 10px; animation: blink 1s infinite; letter-spacing: 2px; }
        
        /* Consola inferior anclada de forma visible */
        #input-area { display: flex; gap: 10px; height: 50px; flex-shrink: 0; }
        input { flex: 1; background: rgba(11,21,36,0.9); border: 1px solid var(--cyan); color: var(--green); padding: 10px 15px; outline: none; font-size: 0.95em; font-family: inherit; clip-path: polygon(0 0, 98% 0, 100% 10px, 100% 100%, 0 100%); }
        input:focus { border-color: var(--green); box-shadow: 0 0 12px rgba(0,255,102,0.2); }
        .btn { background: transparent; color: var(--cyan); border: 1px solid var(--cyan); padding: 10px 20px; font-weight: bold; cursor: pointer; font-family: inherit; font-size: 0.9em; letter-spacing: 1px; clip-path: polygon(0 0, 85% 0, 100% 12px, 100% 100%, 0 100%); flex-shrink: 0; }
        .btn:hover { background: var(--cyan); color: var(--bg); box-shadow: 0 0 15px var(--cyan); }
        .btn.danger { color: var(--red); border-color: var(--red); } .btn.danger:hover { background: var(--red); color: #fff; }
        @keyframes rotHUD { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes rotHUDBack { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
        @keyframes pulseBar { 0%, 100% { transform: scaleY(0.2); } 50% { transform: scaleY(1); } }
        @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    </style>
</head>
<body>
    <div id="hud-layout">
        <!-- MONITOR IZQUIERDO CON PESTAÑAS INTERACTIVAS DE UN CLICK -->
        <div id="left-monitor">
            <div class="nav-tabs">
                <button class="tab-btn active" onclick="cambiarTab('tab-neural')">NEURAL_3D</button>
                <button class="tab-btn" onclick="cambiarTab('tab-activity')">BRAIN_ACT</button>
            </div>
            
            <!-- Pantalla Pestaña 1: Red Neuronal 3D -->
            <div class="cyber-panel tab-content active" id="tab-neural">
                <div class="panel-title"><span>> GRAPH_NEURAL_3D</span></div>
                <canvas id="neuralNet"></canvas>
            </div>
            
            <!-- Pantalla Pestaña 2: Brain Activity e Iconos -->
            <div class="cyber-panel tab-content" id="tab-activity">
                <div class="panel-title">> HUD_MATRIX_DEVICES</div>
                <div class="icon-grid"><div class="ring-box" id="load-percentage">100%</div><div class="radar-box"></div></div>
                <div id="active-core" style="font-size:0.8em; text-align:center; font-weight:bold; background:rgba(0,240,255,0.05); padding:8px; border:1px dashed rgba(0,240,255,0.2);">NÚCLEO_ACTIVO:</div>
                <div class="panel-title" style="margin-top:20px;">> BRAIN_ACTIVITY_SPECTRUM</div>
                <div id="brain-activity">
                    <div class="bar" style="height:75%;"></div><div class="bar" style="height:35%;"></div><div class="bar" style="height:90%;"></div>
                    <div class="bar" style="height:55%;"></div><div class="bar" style="height:25%;"></div><div class="bar" style="height:80%;"></div><div class="bar" style="height:45%;"></div>
                </div>
                <button class="btn danger" onclick="limpiarMemoria()" style="margin-top:20px; width:100%;">PURGAR_BANCOS_MEMORIA</button>
            </div>
        </div>

        <!-- CENTRO DE MANDO PRINCIPAL: CHAT HOLOGRÁFICO -->
        <div class="cyber-panel" id="chat-center">
            <div style="text-align:center; font-weight:bold; letter-spacing:4px; padding-bottom:12px; border-bottom:1px solid rgba(0,240,255,0.3); font-size:1.1em;">✦ NeoX COGNITIVE COMMAND CENTER v10.5 ✦</div>
            <div id="chat-box"></div>
            <div id="thinking-indicator">> NeoX PENSANDO: PROCESANDO ENLACES CUÁNTICOS...</div>
            <div id="input-area">
                <input type="text" id="user-input" placeholder="INGRESE REQUERIMIENTO TÁCTICO..." onkeypress="revisarEnter(event)">
                <button class="btn" onclick="enviarMensaje()">EJECUTAR</button>
            </div>
        </div>
    </div>

    <script>
        const claves = ["AQ.Ab8RN6J-ASHXwXsoHaJiIB0MnRhrQ-xUgzDGM8XccFtZr6SHrQ", "AQ.Ab8RN6IaUAVQYdjNLfWOcIiqnj0_Nd5cB-QyCwTWhXzHIm0KWA", "AQ.Ab8RN6J1Qc6K8DD1ZANPscWF4O_sl_DL5TiN8WPj8gdHU81uCA", "AQ.Ab8RN6I0VZqIgeLDNRZNAwPJ1wpzCemWmOcL1ePlsEe4Gxr8Tg", "AQ.Ab8RN6INnMZXkMHKPN-qM_C5xAKbN7hEVPddRNBp6iWORxbwcA"];
        let idxActual = 0; let historial = [];
        
        if (localStorage.getItem("neox_web_history")) {
            historial = JSON.parse(localStorage.getItem("neox_web_history"));
            reconstruirPantalla();
        } else {
            setTimeout(function() { efectoEscribir("SYSTEM_BOOT", "Sistemas cognitivos en linea. Servidor seguro activo. Esperando directrices, Creador...", "neox"); }, 500);
        }
        
        function cambiarTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
            document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
            document.getElementById(tabId).classList.add('active');
            if(event && event.currentTarget) event.currentTarget.classList.add('active');
        }
        
        function revisarEnter(e) { if (e.key === 'Enter') enviarMensaje(); }
        
        function limpiarMemoria() {
            historial = [];
            localStorage.removeItem("neox_web_history");
            document.getElementById("chat-box").innerHTML = "";
            efectoEscribir("REESTRUCTURACION", "Bancos de memoria a largo plazo purgados de forma segura. Listo.", "neox");
        }
        function reconstruirPantalla() {
            const box = document.getElementById("chat-box"); box.innerHTML = "";
            historial.forEach(function(m) {
                const div = document.createElement("div");
                div.className = "msg " + (m.role === 'user' ? 'user' : 'neox');
                const pfx = m.role === 'user' ? 'CREADOR' : 'NeoX';
                div.innerHTML = '<span class="prefix">[' + pfx + ']</span>' + m.text;
                box.appendChild(div);
            });
            box.scrollTop = box.scrollHeight;
        }
        
        function efectoEscribir(prefix, texto, tipo) {
            const box = document.getElementById("chat-box");
            const div = document.createElement("div");
            div.className = "msg " + tipo;
            div.innerHTML = '<span class="prefix">[' + prefix + ']</span><span class="text-body"></span>';
            box.appendChild(div);
            let i = 0; const span = div.querySelector(".text-body");
            function escribir() {
                if (i < texto.length) {
                    span.innerHTML += texto.charAt(i); i++;
                    box.scrollTop = box.scrollHeight;
                    setTimeout(escribir, 12);
                }
            }
            escribir();
        }
        
        async function enviarMensaje() {
            const input = document.getElementById("user-input");
            const texto = input.value.trim(); if (!texto) return;
            input.value = ""; historial.push({ role: "user", text: texto });
            reconstruirPantalla();
            document.getElementById("thinking-indicator").style.display = "block";
            document.querySelectorAll(".bar").forEach(function(b) { b.style.animationDuration = "0.15s"; });
            const prompt = "Actua como NeoX, un asistente de IA inteligente, con personalidad como JARVIS de Iron Man. Responde de forma brillante y directa. Historial de sesion: " + JSON.stringify(historial.slice(-10)) + " \nMensaje del creador: " + texto;
            await procesarPeticion(prompt);
        }
        
        async function procesarPeticion(prompt) {
            const urlGemini = "https://googleapis.com" + claves[idxActual];
            const urlApi = "https://corsproxy.io?" + encodeURIComponent(urlGemini);
            const datos = { contents: [{ parts: [{ text: prompt }] }] };
            try {
                const r = await fetch(urlApi, { 
                    method: "POST", 
                    headers: { "Content-Type": "application/json" }, 
                    body: JSON.stringify(datos) 
                });
                
                document.getElementById("thinking-indicator").style.display = "none";
                document.querySelectorAll(".bar").forEach(function(b) { b.style.animationDuration = "0.8s"; });
                
                if (r.status === 200) {
                    const json = await r.json(); 
                    const txt = json.candidates[0].content.parts[0].text;
                    historial.push({ role: "model", text: txt });
                    localStorage.setItem("neox_web_history", JSON.stringify(historial));
                    efectoEscribir("NeoX", txt, "neox");
                    actualizarNeuronasRecientes(txt);
                } else if (r.status === 429 || r.status === 403) {
                    if (idxActual < claves.length - 1) {
                        idxActual++;
                        document.getElementById("active-core").innerText = "NÚCLEO_ACTIVO: [0" + (idxActual + 1) + "]";
                        await procesarPeticion(prompt);
                    } else { alert("Bancos de energia de la boveda agotados."); }
                } else { alert("Error de enlace pasarela: " + r.status); }
            } catch (err) {
                document.getElementById("thinking-indicator").style.display = "none";
                alert("Fallo critico de pasarela: " + err);
            }
        }
        const canvas = document.getElementById("neuralNet"); const ctx = canvas.getContext("2d");
        let nodos = []; const totalNodos = 20; let angY = 0.005, angX = 0.002;
        let labels = ["NeoX_Core", "JARVIS_Matrix", "Quantum_Vault", "Memory_JSON", "Google_1.5", "Cyberpunk_UI", "User_Carlos"];
        
        function resCanvas() {
            if (!canvas.parentNode) return;
            canvas.width = canvas.parentNode.clientWidth - 36;
            canvas.height = canvas.parentNode.clientHeight - 70;
        }
        window.addEventListener('resize', resCanvas); setTimeout(resCanvas, 200);
        
        for (let i = 0; i < totalNodos; i++) {
            let u = Math.random(), v = Math.random();
            let theta = u * 2 * Math.PI, phi = Math.acos(2 * v - 1);
            let r = 75;
            nodos.push({
                x: r * Math.sin(phi) * Math.cos(theta),
                y: r * Math.sin(phi) * Math.sin(theta),
                z: r * Math.cos(phi),
                label: i < labels.length ? labels[i] : null
            });
        }
        
        function actualizarNeuronasRecientes(t) {
            let p = t.split(" ").filter(function(w) { return w.length > 5 && w.length < 11; });
            if (p.length > 0) {
                let n = nodos[Math.floor(Math.random() * nodos.length)];
                let lim = p.replace(/[^a-zA-Z]/g, "");
                if (lim) n.label = lim + "_Memory";
            }
        }
        
        function rotar() {
            let cY = Math.cos(angY), sY = Math.sin(angY), cX = Math.cos(angX), sX = Math.sin(angX);
            nodos.forEach(function(n) {
                let x1 = n.x * cY - n.z * sY, z1 = n.z * cY + n.x * sY;
                let y2 = n.y * cX - z1 * sX, z2 = z1 * cX + n.y * sX;
                n.x = x1; n.y = y2; n.z = z2;
            });
        }
        
        function render() {
            if (canvas.width === 0) resCanvas();
            ctx.clearRect(0, 0, canvas.width, canvas.height); rotar();
            let cx = canvas.width / 2, cy = canvas.height / 2, fov = 130;
            ctx.strokeStyle = "rgba(0,240,255,0.15)"; ctx.lineWidth = 1;
            for (let i = 0; i < nodos.length; i++) {
                for (let j = i + 1; j < nodos.length; j++) {
                    if (Math.sqrt(Math.pow(nodos[i].x - nodos[j].x, 2) + Math.pow(nodos[i].y - nodos[j].y, 2)) < 110) {
                        let si = fov / (fov + nodos[i].z), sj = fov / (fov + nodos[j].z);
                        ctx.beginPath(); ctx.moveTo(cx + nodos[i].x * si, cy + nodos[i].y * si); ctx.lineTo(cx + nodos[j].x * sj, cy + nodos[j].y * sj); ctx.stroke();
                    }
                }
            }
            nodos.forEach(function(n) {
                let e = fov / (fov + n.z), x = cx + n.x * e, y = cy + n.y * e, rd = Math.max(1, 3.5 * e), al = (fov - n.z) / (2 * fov);
                ctx.fillStyle = n.label ? "rgba(0,255,102," + (al + 0.4) + ")" : "rgba(0,240,255," + al + ")";
                ctx.beginPath(); ctx.arc(x, y, rd, 0, 2 * Math.PI); ctx.fill();
                if (n.label && n.z < 15) {
                    ctx.fillStyle = "rgba(230,237,243," + (al + 0.3) + ")";
                    ctx.font = Math.max(7, 9 * e) + "px 'Share Tech Mono'";
                    ctx.fillText("[" + n.label + "]", x + 7, y + 3);
                }
            });
            const p = document.getElementById("load-percentage"); if (p) p.innerText = Math.floor(93 + Math.random() * 8) + "%";
            requestAnimationFrame(render);
        }
        requestAnimationFrame(render);
    </script>
</body>
</html>
